<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Word Drop – Typing Game</title>
  <!-- Phones: "Add to Home Screen" opens the game like an app, without the browser bars
       (the only way to get full screen on an iPhone). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d0d1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Word Drop" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0d0d1a;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
      touch-action: manipulation;           /* no double-tap zoom while tapping the on-screen keys */
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Our own files are always fetched fresh (?v=timestamp): a reload — also the automatic one
       from the update watcher in game.txt — must never run an old, cached copy. -->
  <script>var __v = Date.now();</script>
  <!-- English lessons (Science lessons are loaded from Science.txt by game.txt) -->
  <script>document.write('<script src="english_words.js?v=' + __v + '"><\/script>');</script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <!-- Firebase (global leaderboard) — must load before game.txt -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
  <script>document.write('<script src="game.txt?v=' + __v + '"><\/script>');</script>
</body>
</html>
